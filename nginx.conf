server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;
    charset utf-8;
    charset_types application/json application/javascript text/javascript text/css;

    # Förkomprimerade filer (.gz skapade med zopfli i byggsteget) – ingen CPU per request.
    gzip_static on;
    gzip_vary   on;
    # Fallback för eventuella okomprimerade svar
    gzip        on;
    gzip_types  application/json application/javascript text/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    sendfile    on;
    tcp_nopush  on;
    open_file_cache          max=64 inactive=60s;
    open_file_cache_valid    60s;

    # Säkerhetsheaders. Produktbilder laddas från Shopifys CDN, CSS ligger inline i index.html.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://cdn.shopify.com data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Filnamnen saknar innehållshash, så webbläsaren revaliderar alltid (billigt 304 via ETag).
    # Nya priser/data syns därmed direkt efter en ny image.
    add_header Cache-Control "no-cache" always;

    # (inga add_header i location-blocken nedan, så headers ovan ärvs)
    location / {
        try_files $uri $uri/ =404;
    }

    # .gz-filerna ska inte kunna hämtas direkt
    location ~ \.gz$ { return 404; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
