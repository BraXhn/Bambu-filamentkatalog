services:
  katalog:
    image: ghcr.io/braxhn/bambu-filamentkatalog:latest
    build: .
    container_name: katalog
    ports:
      - "8000:8080"
    volumes:
      - katalog-data:/data          # användare, sessioner och nattliga priser
    environment:
      TZ: Europe/Stockholm
      PRICE_UPDATE_TIME: "01:00"    # tom sträng stänger av den schemalagda uppdateringen
      BAMBU_SYNC_HOURS: "6"         # synk från kopplade Bambu Lab-konton
      # Valfritt: skapa första administratören automatiskt (ta bort lösenordet efter första start).
      # ADMIN_USERNAME: anton
      # ADMIN_PASSWORD: byt-till-en-lang-fras
      # Bakom en omvänd proxy (Nginx Proxy Manager, Traefik, SWAG, Cloudflare Tunnel …):
      # ange proxyns adress/nät så att riktiga klient-IP och https känns igen.
      # TRUSTED_PROXIES: 172.18.0.0/16
      # COOKIE_SECURE: "true"       # rekommenderas när sajten bara nås via https
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 256
    restart: unless-stopped

volumes:
  katalog-data:
