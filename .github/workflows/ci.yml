name: Bygg och testa

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/braxhn/bambu-filamentkatalog

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Enhetstester (inloggning, behörighet, prishämtare)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: docker/setup-buildx-action@v3
      - name: Bygg image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: katalog:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Starta containern (skrivskyddad, utan rättigheter)
        env:
          CI_ADMIN_PASSWORD: Ci-test-fras-som-ar-lang-42
        run: |
          docker run -d --name katalog -p 8000:8080 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -e ADMIN_USERNAME=ci-admin -e ADMIN_PASSWORD="$CI_ADMIN_PASSWORD" \
            -e PRICE_UPDATE_TIME= katalog:test
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' katalog)" = healthy ] && break; sleep 2
          done
          docker inspect -f 'Hälsa: {{.State.Health.Status}}' katalog
          docker images katalog:test --format 'Imagestorlek: {{.Size}}'
          echo "::notice title=Image::$(docker images katalog:test --format '{{.Size}}')"
      - name: Integrationstest
        env:
          CI_ADMIN_PASSWORD: Ci-test-fras-som-ar-lang-42
        run: python3 tests/integration.py http://127.0.0.1:8000
      - name: Kommandon i containern
        run: |
          docker exec katalog python3 -m katalog users
          docker exec katalog python3 -m katalog add-user cli-test
      - name: Containerlogg vid fel
        if: failure()
        run: |
          docker logs katalog 2>&1 | tail -60
          docker logs katalog 2>&1 | tail -25 | sed 's/^/::error title=Containerlogg::/'

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bygg och publicera (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "::notice title=Publicerad::${{ env.IMAGE }}:latest"
