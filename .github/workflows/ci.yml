name: Bygg och testa

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/braxhn/bambu-filamentkatalog

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.13' }
      - name: Enhetstester (inloggning, behörighet, prishämtare)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: docker/setup-buildx-action@v4
      - name: Bygg image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: katalog:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Starta containern (Unraids parametrar, bridge-nät)
        env:
          CI_ADMIN_PASSWORD: Ci-test-fras-som-ar-lang-42
        run: |
          mkdir -p "$RUNNER_TEMP/appdata" && sudo chown root:root "$RUNNER_TEMP/appdata"
          docker run -d --name katalog -p 8000:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            --cap-add DAC_OVERRIDE --security-opt no-new-privileges \
            -v "$RUNNER_TEMP/appdata:/data" \
            -e ADMIN_USERNAME=ci-admin -e ADMIN_PASSWORD="$CI_ADMIN_PASSWORD" \
            -e PRICE_UPDATE_TIME= -e TRUSTED_PROXIES=172.16.0.0/12 katalog:test
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' katalog)" = healthy ] && break; sleep 2
          done
          docker inspect -f 'Hälsa: {{.State.Health.Status}}' katalog
          echo "::notice title=Image::$(docker images katalog:test --format '{{.Size}}')"
          echo "::notice title=Datamapp::ägare $(sudo stat -c %u:%g "$RUNNER_TEMP/appdata") (förväntat 99:100), processer: $(docker top katalog -o user,args | tail -n +2 | tr '\n' ';')"
      - name: Integrationstest
        env:
          CI_ADMIN_PASSWORD: Ci-test-fras-som-ar-lang-42
        run: python3 tests/integration.py http://127.0.0.1:8000
      - name: Belastningstest (60 s, 12 klienter + 20 tysta anslutningar)
        run: python3 tests/soak.py http://127.0.0.1:8000 ci-admin Ci-test-fras-som-ar-lang-42 60
      - name: Stabilitet efter belastning
        run: |
          R=$(docker inspect -f '{{.RestartCount}} {{.State.Status}} {{.State.OOMKilled}}' katalog)
          M=$(docker stats --no-stream --format '{{.MemUsage}}' katalog)
          echo "::notice title=Stabilitet::omstarter/status/OOM: $R, minne: $M"
          [ "$(docker inspect -f '{{.State.Running}}' katalog)" = true ]
      - name: Kommandon i containern
        run: |
          docker exec katalog python -m katalog users
          docker exec katalog python -m katalog add-user cli-test
      - name: Containerlogg vid fel
        if: failure()
        run: |
          docker logs katalog 2>&1 | tail -60
          docker logs katalog 2>&1 | tail -25 | sed 's/^/::error title=Containerlogg::/'

  unraid:
    name: Unraid-simulering (egen IP via macvlan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: katalog:test
          cache-from: type=gha
      - name: Starta på egen IP (som br0 i Unraid) med gammal datamapp ägd av 101
        run: |
          PARENT=$(ip route show default | awk '{print $5; exit}')
          docker network create -d macvlan --subnet=192.168.77.0/24 --gateway=192.168.77.1 -o parent=$PARENT br0
          mkdir -p "$RUNNER_TEMP/appdata/www" && echo '{}' > "$RUNNER_TEMP/appdata/old.json" && sudo chown -R 101:101 "$RUNNER_TEMP/appdata"
          docker run -d --name katalog --network br0 --ip 192.168.77.10 \
            --read-only --tmpfs /tmp --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            --cap-add DAC_OVERRIDE --security-opt no-new-privileges \
            -v "$RUNNER_TEMP/appdata:/data" -e TZ=Europe/Stockholm -e PRICE_UPDATE_TIME=01:00 \
            -e ADMIN_USERNAME=ci-admin -e ADMIN_PASSWORD=Ci-test-fras-som-ar-lang-42 -e TRUSTED_PROXIES=192.168.77.0/24 \
            katalog:test
          sleep 8
          docker logs katalog 2>&1 | head -20
      - name: Klient på samma nät (som telefon/dator i hemnätet)
        run: |
          docker run --rm --network br0 --ip 192.168.77.20 -v "$PWD/tests:/t:ro" -e CI_ADMIN_PASSWORD=Ci-test-fras-som-ar-lang-42 \
            python:3.13-alpine sh -c 'python /t/integration.py http://192.168.77.10:8080 && python /t/soak.py http://192.168.77.10:8080 ci-admin Ci-test-fras-som-ar-lang-42 45'
      - name: Kontroll
        run: |
          echo "::notice title=Unraid-simulering::$(docker inspect -f 'omstarter {{.RestartCount}}, status {{.State.Status}}, OOM {{.State.OOMKilled}}' katalog); datamapp $(sudo stat -c %u:%g "$RUNNER_TEMP/appdata")"
          docker logs katalog 2>&1 | grep -E '^\[start\]' | sed 's/^/::notice title=Startlogg::/'
          echo "::notice title=Loggrader::$(docker logs katalog 2>&1 | grep -c '"GET') sidvisningar loggade"
          [ "$(docker inspect -f '{{.State.Running}}' katalog)" = true ]
          [ "$(sudo stat -c %u:%g "$RUNNER_TEMP/appdata")" = "99:100" ]
      - name: Gammal installation (alla rättigheter borttagna) ger tydligt fel
        run: |
          docker run -d --name gammal --cap-drop ALL --security-opt no-new-privileges katalog:test
          sleep 4
          docker logs gammal 2>&1 | grep -q 'Extra Parameters' && echo "::notice title=Gammal installation::tydligt felmeddelande i loggen"
          docker logs gammal 2>&1 | grep -q 'Extra Parameters'
      - name: Containerlogg vid fel
        if: failure()
        run: docker logs katalog 2>&1 | tail -30 | sed 's/^/::error title=Containerlogg::/'

  publish:
    needs: [test, unraid]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bygg och publicera (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "::notice title=Publicerad::${{ env.IMAGE }}:latest"
