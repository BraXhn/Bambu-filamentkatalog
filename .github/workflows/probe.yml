name: probe
on: { push: { branches: [probe] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          get(){ curl -sS --compressed -A "$UA" -H 'Accept-Language: sv-SE,sv;q=0.9' $3 -o "$1" -D "$1.h" -w "$1 %{http_code} %{size_download} %{redirect_url}\n" "$2" >> index.txt || echo "$1 FAIL" >> index.txt; }
          B=https://eu.store.bambulab.com
          get p1.json "$B/products/pla-basic-filament.js"
          get p2.json "$B/products/pla-basic-filament.js" "-b localization=SE;cart_currency=SEK"
          get p3.json "$B/products/pla-basic-filament.js?currency=SEK&country=SE" "-b localization=SE"
          get p4.json "$B/sv-se/products/pla-basic-filament.js" "-b localization=SE"
          get p5.json "$B/products/pla-basic-filament.json" "-b localization=SE;cart_currency=SEK"
          get ship.html "$B/policies/shipping-policy" "-b localization=SE"
          get ship2.html "$B/pages/shipping-policy" "-b localization=SE"
          get home.html "$B/" "-b localization=SE"
          python3 - <<'EOF' >> index.txt
          import json,re,glob
          for f in sorted(glob.glob('p*.json')):
              try:
                  d=json.load(open(f)); v=d.get('variants') or d.get('product',{}).get('variants',[])
                  print(f,'title',d.get('title') or d.get('product',{}).get('title'),'variants',len(v))
                  for x in v[:4]: print('   ',{k:x.get(k) for k in ('title','option1','option2','option3','price','compare_at_price','available','sku')})
              except Exception as e: print(f,'ej json',e, open(f,errors='replace').read()[:200])
          for f in ['ship.html','ship2.html','home.html']:
              s=open(f,errors='replace').read(); t=re.sub(r'<[^>]+>',' ',s); t=re.sub(r'\s+',' ',t)
              for k in ['Sweden','Sverige','SEK','free shipping','Free shipping','gratis frakt','Fri frakt','€','kr ']:
                  i=t.find(k)
                  if i>=0: print(f,k,'::',t[max(0,i-200):i+250])
              print(f,'currency meta',re.findall(r'"currency":"([A-Z]{3})"',s)[:3], re.findall(r'Shopify\.currency\s*=\s*(\{[^}]+\})',s)[:1], re.findall(r'"country":"([A-Z]{2})"',s)[:2])
          EOF
          grep -i '^location\|^set-cookie: localization\|^set-cookie: cart_currency' p*.json.h home.html.h | head -20 >> index.txt
          cat index.txt
      - run: |
          cd out && git init -q && git checkout -q -b probe-results && git add -A
          git -c user.name=probe -c user.email=probe@local commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-results
