name: probe
on: { push: { branches: [probe] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          get(){ curl -sS --compressed -A "$UA" -o "$1" -w "$1 %{http_code} %{size_download} %{content_type} %{redirect_url}\n" "$2" >> index.txt || echo "$1 FAIL" >> index.txt; }
          B=https://us.store.bambulab.com
          get prod.html "$B/products/pla-basic-filament"
          get prod.js "$B/products/pla-basic-filament.js"
          get all.json "$B/collections/all/products.json?limit=5"
          get fil.json "$B/collections/filament/products.json?limit=5"
          get sitemap.xml "$B/sitemap.xml"
          get robots.txt "$B/robots.txt"
          get api1.json "$B/api/products/pla-basic-filament"
          python3 - <<'EOF' >> index.txt
          import re,json
          s=open('prod.html',errors='replace').read()
          print('html len',len(s),'title',re.search(r'<title>(.*?)</title>',s,re.S) and re.search(r'<title>(.*?)</title>',s,re.S)[1][:80])
          print('next_data',s.count('__NEXT_DATA__'),'next_f',s.count('self.__next_f'),'ld+json',s.count('application/ld+json'),'Shopify',s.count('Shopify'),'shopify',s.count('shopify'))
          for k in ['"price"','compareAtPrice','compare_at_price','availableForSale','"available"','variantId','"variants"','priceV2','amount','currencyCode','10101','storefront','graphql','myshopify']:
              n=s.count(k)
              if n:
                  i=s.find(k); print(' ',k,n,repr(s[max(0,i-150):i+250]))
          for m in re.findall(r'<script[^>]*application/ld\+json[^>]*>(.*?)</script>',s,re.S)[:2]: print('LD',m[:600])
          r=open('robots.txt',errors='replace').read(); print('robots',r[:600])
          sm=open('sitemap.xml',errors='replace').read(); print('sitemap',sm[:500])
          EOF
          cat index.txt
      - run: |
          cd out && git init -q && git checkout -q -b probe-results && git add -A
          git -c user.name=probe -c user.email=probe@local commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-results
