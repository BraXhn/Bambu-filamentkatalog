name: probe
on: { push: { branches: [probe] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          get(){ curl -sSL --compressed -A "$UA" -H 'Accept-Language: sv-SE,sv;q=0.9' -o "$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" "$2" >> index.txt || echo "$1 FAIL" >> index.txt; }
          get jake_sale.html 'https://www.3djake.se/erbjudanden'
          get jake_sale2.html 'https://www.3djake.se/sale'
          get jake_cat.html 'https://www.3djake.se/bambu-lab/bambu-lab-filament'
          get jake_pla.html 'https://www.3djake.se/filament/pla-filament'
          python3 - <<'EOF' >> index.txt
          import re,glob
          for f in sorted(glob.glob('jake_*.html')):
              s=open(f,encoding='utf8',errors='replace').read()
              links=sorted(set(re.findall(r'href="(/bambu-lab/[^"#]+)"',s)))
              print(f,'bambu-länkar',len(links),links[:40])
              for k in ['p-price__old','price--old','--old','strike','<s>','<del','UVP','Ord.pris','ordinarie','tidigare pris','Tidigare pris','lowest','-%','chip--sale','sale']:
                  n=s.count(k)
                  if n:
                      i=s.find(k); print(' ',k,n,repr(re.sub(r'\s+',' ',s[max(0,i-200):i+200])))
          EOF
          cat index.txt
      - run: |
          cd out && git init -q && git checkout -q -b probe-results && git add -A
          git -c user.name=probe -c user.email=probe@local commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-results
