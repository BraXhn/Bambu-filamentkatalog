name: probe
on: { push: { branches: [probe] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          get(){ curl -sSL --compressed -A "$UA" -H 'Accept-Language: sv-SE,sv;q=0.9' -o "$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" "$2" >> index.txt || echo "$1 FAIL" >> index.txt; }
          get jake_prod.html 'https://www.3djake.se/bambu-lab/petg-translucent-clear?sai=23546'
          get jake_prod2.html 'https://www.3djake.se/bambu-lab/pla-basic-black'
          get jake_brand.html 'https://www.3djake.se/bambu-lab'
          get jake_fil.html 'https://www.3djake.se/bambu-lab/filament'
          get jake_search.html 'https://www.3djake.se/search?q=bambu+lab+pla+basic'
          get prima_prod.html 'https://www.3dprima.com/se/filament-resin/filament/pla/oevriga/bambu-lab-pla-basic_30209_12664'
          get prima_search.html 'https://www.3dprima.com/se/search/?q=bambu+lab'
          get trad_item.html 'https://www.tradera.com/item/344346/753446348/petg-hf-farg-black-33102-bambu-lab-filament'
          get trad_search.html 'https://www.tradera.com/search?q=bambu%20lab%20filament'
          get trad_api.json 'https://www.tradera.com/api/webapi/discover/web/search?query=bambu%20lab%20filament'
          get bambu_eu.json 'https://eu.store.bambulab.com/products.json?limit=250&page=1'
          get bambu_eu_prod.json 'https://eu.store.bambulab.com/products/pla-basic-filament.json'
          cat index.txt
      - run: |
          cd out && git init -q && git checkout -q -b probe-results && git add -A
          git -c user.name=probe -c user.email=probe@local commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-results
