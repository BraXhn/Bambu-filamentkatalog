name: probe
on: { push: { branches: [probe] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          export KATALOG_DATA_DIR=$PWD/data KATALOG_SEED_DIR=$PWD/dist
          mkdir -p data/www out && echo '{"offers":[]}' > data/www/offers.json
          python3 -m katalog update --sources 3dverkstan,3dexperten > out/update.log 2>&1 || true
          python3 - <<'PY' > out/check.txt
          import json
          cat={d['type']+'|'+(d['code'] or d['name']):d for d in json.load(open('dist/data.json'))}
          for o in json.load(open('data/www/offers.json'))['offers']:
              d=cat[o['key']]
              print(o['shop'],'|',o['price'],o.get('listPrice'),o['pack'],o['weight'],'|',d['type'],'·',d['name'],'<=',o['title'],'|',o['url'][-50:])
          PY
          cp data/www/offers.json out/
      - run: |
          cd out && git init -q && git checkout -q -b probe-results && git add -A
          git -c user.name=probe -c user.email=probe@local commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-results
