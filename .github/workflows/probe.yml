name: probe
on: { push: { branches: [probe] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          curl -sSL -o fcc.json -w "fcc %{http_code} %{size_download}\n" https://raw.githubusercontent.com/bambulab/BambuStudio/master/resources/profiles/BBL/filament/filaments_color_codes.json >> index.txt
          cat > t.py <<'EOF'
          import json, sys, urllib.request, urllib.error
          B='https://api.bambulab.com'
          def u(name, url, body=None, headers=None):
              h={'Content-Type':'application/json','User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36','Accept':'application/json'}
              h.update(headers or {})
              r=urllib.request.Request(url, data=json.dumps(body).encode() if body else None, headers=h, method='POST' if body else 'GET')
              try:
                  with urllib.request.urlopen(r, timeout=20) as x: s,t=x.status,x.read()[:300]
              except urllib.error.HTTPError as e: s,t=e.code,e.read()[:300]
              except Exception as e: s,t='ERR',str(e).encode()
              print(name, s, t)
          u('urllib-login', B+'/v1/user-service/user/login', {'account':'probe-nonexistent@example.com','password':'x-not-real','apiError':''})
          u('urllib-spools', B+'/v1/design-user-service/my/filament/v2?offset=0&limit=1')
          u('urllib-agent-login', B+'/v1/user-service/user/login', {'account':'probe-nonexistent@example.com','password':'x-not-real','apiError':''}, {'User-Agent':'bambu_network_agent/02.03.00.62'})
          EOF
          python3 t.py >> index.txt 2>&1
          echo "curl-login $(curl -sS -m 20 -o c.txt -w '%{http_code}' -H 'Content-Type: application/json' -A 'Mozilla/5.0 Chrome/129.0' -d '{"account":"probe-nonexistent@example.com","password":"x-not-real","apiError":""}' https://api.bambulab.com/v1/user-service/user/login) $(head -c 300 c.txt)" >> index.txt
          docker run --rm -v "$PWD:/w" python:3.12-alpine sh -c 'pip install -q curl_cffi 2>&1 | tail -2; python -c "
          from curl_cffi import requests as r
          x=r.post(\"https://api.bambulab.com/v1/user-service/user/login\",json={\"account\":\"probe-nonexistent@example.com\",\"password\":\"x-not-real\",\"apiError\":\"\"},impersonate=\"chrome\",timeout=20)
          print(\"cffi-alpine-login\",x.status_code,x.text[:300])
          x=r.get(\"https://api.bambulab.com/v1/design-user-service/my/filament/v2?offset=0&limit=1\",impersonate=\"chrome\",timeout=20)
          print(\"cffi-alpine-spools\",x.status_code,x.text[:300])
          "; pip show curl_cffi | head -3; du -sh /usr/local/lib/python3.12/site-packages/curl_cffi*' >> index.txt 2>&1
          docker run --rm python:3.12-alpine sh -c 'apk add -q py3-cffi >/dev/null 2>&1; apk search curl_cffi py3-curl' >> index.txt 2>&1 || true
          cat index.txt
      - run: |
          cd out && git init -q && git checkout -q -b probe-results && git add -A
          git -c user.name=probe -c user.email=probe@local commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-results
